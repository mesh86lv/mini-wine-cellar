packages: ["apps/*"]

# pnpm 11 runs no dependency lifecycle scripts unless a package is listed here.
# `false` is a decision as well: the script is skipped and the package no longer
# trips strictDepBuilds, so `pnpm install` stays a valid clean-clone step.
allowBuilds:
  "@apollo/protobufjs": false
  "@parcel/watcher": true
  esbuild: true

# `pnpm install` refuses a version younger than its minimum release age. lucide-react 1.67.0 is the
# pinned icon set of the shadcn components and was still inside that window, so pnpm added this
# exclusion itself; it is kept so a clean-clone install resolves the same version.
minimumReleaseAgeExclude:
  - lucide-react@1.67.0
