name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version`: the action reads the pinned pnpm from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Generated output is committed, so an out-of-date checkout has to fail the build.
      - run: pnpm codegen
      - run: git diff --exit-code apps/web/src/gql

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
